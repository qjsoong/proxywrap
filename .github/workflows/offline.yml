name: Linux offline bundle
on:
  workflow_dispatch:
  pull_request:
    paths:
      - install.sh
      - scripts/build-offline.sh
      - .github/workflows/offline.yml
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - name: Install build prerequisites
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y git curl ca-certificates python3 python3-venv
      - uses: actions/checkout@v4
      - name: Build Ubuntu 24.04 AMD64 transfer media
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bash scripts/build-offline.sh
      - uses: actions/upload-artifact@v4
        with:
          name: proxywrap-offline-ubuntu-24.04-amd64
          path: dist/proxywrap-offline-*
          if-no-files-found: error
  offline-smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: proxywrap-offline-ubuntu-24.04-amd64
          path: media
      - name: Extract verified transfer media
        run: |
          cd media
          sha256sum --check *.sha256
          tar -xzf *.tar.gz
      - name: Install payload in a fresh container with no network
        run: |
          docker pull ubuntu:24.04
          docker run --rm --network none \
            -e PW_OFFLINE_CONTAINER_TEST=1 \
            -v "$PWD/media:/media:ro" ubuntu:24.04 \
            bash /media/proxywrap-offline/scripts/test-offline-payload.sh
